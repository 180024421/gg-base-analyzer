[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gg-base-analyzer"
version = "0.1.0"
description = "从 GameGuardian 导出结果分析稳定基址链，并导出 Frida/Lua/JSON"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "gg-base-analyzer" }]
dependencies = []

[project.optional-dependencies]
online = ["frida>=16.0.0", "frida-tools>=12.0.0"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
gg-base-analyzer = "gg_base_analyzer.__main__:main"

[tool.setuptools.packages.find]
include = ["gg_base_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
